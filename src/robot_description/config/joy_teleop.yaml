teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true   # el robot solo se mueve con RT presionado
    enable_button: 4              # LB
    enable_turbo_button: 5        # RB (más rápido)

    axis_linear:
      x: 1                        # stick izquierdo vertical
    scale_linear:
      x: 0.3                      # m/s normal
    scale_linear_turbo:
      x: 0.6                      # m/s con RB

    axis_angular:
      yaw: 0                      # stick izquierdo horizontal
    scale_angular:
      yaw: 1.5                    # rad/s normal
    scale_angular_turbo:
      yaw: 2.5                    # rad/s con RB